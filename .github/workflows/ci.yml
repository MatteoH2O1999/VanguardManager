name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.x"

jobs:
  lint:
    name: Lint code
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore tools
        run: dotnet tool restore
      - name: Run csharpier code style formattter
        run: dotnet csharpier check . --log-level Debug
      - name: Run .NET style formatter
        run: dotnet format style --verify-no-changes --severity info -v n .
      - name: Run .NET analyzers
        run: dotnet format analyzers --verify-no-changes --severity info -v n .

  codeql:
    name: CodeQL
    runs-on: windows-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: autobuild
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  build:
    name: Build project
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build installers
        run: dotnet build -c=Release ./Installer/Installer.wixproj

  dispatch:
    name: Check if a release needs to be created
    runs-on: windows-latest
    needs: [build, codeql, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run dispatch script
        run: dotnet run ./.github/scripts/dispatch.cs
        env:
          GITHUB_TOKEN: ${{ github.token }}
